rogress id="progress" value="0"> <div class="progress-container"> <span class="progress-bar"></span> </div> </progress> </header> <div class="container mt-5" role="main"> <div class="post"> <header class="post-header"> <h1 class="post-title">projects</h1> <p class="post-description">Selected research and engineering projects in protein design, computational biology, and device development.</p> </header> <article> <div class="projects"> <a id="research" href=".#research"> <h2 class="category">research</h2> </a> <div class="row row-cols-1 row-cols-md-3"> <div class="col"> <figure class="tilted-card project-tilt"> <div class="tilted-card__shadow" aria-hidden="true"></div> <a class="tilted-card__body" href="/projects/Hallucination%20Co-Design%20of%20Protein%E2%80%93RNA%20Complexes%20/"> <div class="tilted-card__face"> <div class="project-tilt__visual project-tilt__visual--paired"> <img src="/assets/img/bird-8f5g-complex.png" alt="BIRD protein–RNA complex: 8F5G C03, 62.3 ns snapshot" loading="lazy" decoding="async"> <img src="/assets/img/bird-mark.png" alt="Original bird illustration from the BIRD repository logo" loading="lazy" decoding="async"> <span class="project-tilt__glass">research</span> </div> <div class="project-tilt__content"> <h2 class="card-title">BIRD: Biophysics Informed de novo RNA Binder Design</h2> <p class="card-text">Designing RNA sequences for protein targets by optimizing structural confidence, RNA geometry, and interface chemistry.</p> </div> <span class="tilted-card__glare" aria-hidden="true"></span> <span class="tilted-card__rim" aria-hidden="true"></span> <span class="tilted-card__edge" aria-hidden="true"></span> </div> </a> <figcaption class="tilted-card__caption" aria-hidden="true">BIRD · RNA binder design</figcaption> </figure> </div> <div class="col"> <figure class="tilted-card project-tilt"> <div class="tilted-card__shadow" aria-hidden="true"></div> <a class="tilted-card__body" href="/projects/bc-design/"> <div class="tilted-card__face"> <div class="project-tilt__visual"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/bc-design-official-overview-480.webp 480w,/assets/img/bc-design-official-overview-800.webp 800w,/assets/img/bc-design-official-overview-1400.webp 1400w," type="image/webp" sizes="(max-width: 767px) 90vw, 300px"></source> <img src="/assets/img/bc-design-official-overview.png" width="100%" height="auto" alt="Original BC-Design overview figure from the official repository" loading="lazy" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> </figure> <span class="project-tilt__glass">research</span> </div> <div class="project-tilt__content"> <h2 class="card-title">BC-Design: A Biochemistry-Aware Framework for Inverse Protein Design</h2> <p class="card-text">Evaluating how biochemical conditioning shapes protein sequence design through controlled experiments and molecular dynamics analysis.</p> </div> <span class="tilted-card__glare" aria-hidden="true"></span> <span class="tilted-card__rim" aria-hidden="true"></span> <span class="tilted-card__edge" aria-hidden="true"></span> </div> </a> <figcaption class="tilted-card__caption" aria-hidden="true">BC-Design · Biochemical conditioning</figcaption> </figure> </div> <div class="col"> <figure class="tilted-card project-tilt"> <div class="tilted-card__shadow" aria-hidden="true"></div> <a class="tilted-card__body" href="/projects/HelixLinkerLab/"> <div class="tilted-card__face"> <div class="project-tilt__visual"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/logicofHelixLinkerLab-480.webp 480w,/assets/img/logicofHelixLinkerLab-800.webp 800w,/assets/img/logicofHelixLinkerLab-1400.webp 1400w," type="image/webp" sizes="(max-width: 767px) 90vw, 300px"></source> <img src="/assets/img/logicofHelixLinkerLab.png" width="100%" height="auto" alt="HelixLinkerLab: An Automated Pipeline for Protein Linker Design" loading="lazy" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> </figure> <span class="project-tilt__glass">research</span> </div> <div class="project-tilt__content"> <h2 class="card-title">HelixLinkerLab: An Automated Pipeline for Protein Linker Design</h2> <p class="card-text">A reusable pipeline for designing de novo helical linkers with structure prediction and inverse folding.</p> </div> <span class="tilted-card__glare" aria-hidden="true"></span> <span class="tilted-card__rim" aria-hidden="true"></span> <span class="tilted-card__edge" aria-hidden="true"></span> </div> </a> <figcaption class="tilted-card__caption" aria-hidden="true">HelixLinkerLab: An Automated Pipeline for Protein Linker Design</figcaption> </figure> </div> <div class="col"> <figure class="tilted-card project-tilt"> <div class="tilted-card__shadow" aria-hidden="true"></div> <a class="tilted-card__body" href="/projects/mbp-dele1-linker-design/"> <div class="tilted-card__face"> <div class="project-tilt__visual"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/mbp-dele1-linker-cover-withtag-480.webp 480w,/assets/img/mbp-dele1-linker-cover-withtag-800.webp 800w,/assets/img/mbp-dele1-linker-cover-withtag-1400.webp 1400w," type="image/webp" sizes="(max-width: 767px) 90vw, 300px"></source> <img src="/assets/img/mbp-dele1-linker-cover-withtag.jpg" width="100%" height="auto" alt="De novo Helical Linker Design for MBP–DELE1 Fusion Proteins" loading="lazy" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> </figure> <span class="project-tilt__glass">research</span> </div> <div class="project-tilt__content"> <h2 class="card-title">De novo Helical Linker Design for MBP–DELE1 Fusion Proteins</h2> <p class="card-text">Designing rigid helical linkers to stabilize flexible DELE1 constructs for cryo-EM using RFdiffusion, ProteinMPNN, and AlphaFold3.</p> </div> <span class="tilted-card__glare" aria-hidden="true"></span> <span class="tilted-card__rim" aria-hidden="true"></span> <span class="tilted-card__edge" aria-hidden="true"></span> </div> </a> <figcaption class="tilted-card__caption" aria-hidden="true">De novo Helical Linker Design for MBP–DELE1 Fusion Proteins</figcaption> </figure> </div> <div class="col"> <figure class="tilted-card project-tilt"> <div class="tilted-card__shadow" aria-hidden="true"></div> <a class="tilted-card__body" href="/projects/DELE-1%20binder%20design/"> <div class="tilted-card__face"> <div class="project-tilt__visual"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/photoofbinderdesign-6-480.webp 480w,/assets/img/photoofbinderdesign-6-800.webp 800w,/assets/img/photoofbinderdesign-6-1400.webp 1400w," type="image/webp" sizes="(max-width: 767px) 90vw, 300px"></source> <img src="/assets/img/photoofbinderdesign-6.png" width="100%" height="auto" alt="De Novo Binder Design Targeting DELE1" loading="lazy" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> </figure> <span class="project-tilt__glass">research</span> </div> <div class="project-tilt__content"> <h2 class="card-title">De Novo Binder Design Targeting DELE1</h2> <p class="card-text">Computational design of candidate binders targeting DELE1 to perturb DELE1-HRI interactions.</p> </div> <span class="tilted-card__glare" aria-hidden="true"></span> <span class="tilted-card__rim" aria-hidden="true"></span> <span class="tilted-card__edge" aria-hidden="true"></span> </div> </a> <figcaption class="tilted-card__caption" aria-hidden="true">De Novo Binder Design Targeting DELE1</figcaption> </figure> </div> <div class="col"> <figure class="tilted-card project-tilt"> <div class="tilted-card__shadow" aria-hidden="true"></div> <a class="tilted-card__body" href="/projects/RFdiffusion-based%20symmetric%20protein%20design/"> <div class="tilted-card__face"> <div class="project-tilt__visual"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/symemtrical-protein-cover-480.webp 480w,/assets/img/symemtrical-protein-cover-800.webp 800w,/assets/img/symemtrical-protein-cover-1400.webp 1400w," type="image/webp" sizes="(max-width: 767px) 90vw, 300px"></source> <img src="/assets/img/symemtrical-protein-cover.png" width="100%" height="auto" alt="RFdiffusion-based de novo symmetric protein design" loading="lazy" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> </figure> <span class="project-tilt__glass">research</span> </div> <div class="project-tilt__content"> <h2 class="card-title">RFdiffusion-based de novo symmetric protein design</h2> <p class="card-text">De novo design of closed repeat proteins using RFdiffusion, ProteinMPNN, and SuperFold at SUSTech under the supervision of Prof. Zhe Li.</p> </div> <span class="tilted-card__glare" aria-hidden="true"></span> <span class="tilted-card__rim" aria-hidden="true"></span> <span class="tilted-card__edge" aria-hidden="true"></span> </div> </a> <figcaption class="tilted-card__caption" aria-hidden="true">RFdiffusion-based de novo symmetric protein design</figcaption> </figure> </div> </div> <a id="engineering" href=".#engineering"> <h2 class="category">engineering</h2> </a> <div class="row row-cols-1 row-cols-md-3"> <div class="col"> <figure class="tilted-card project-tilt"> <div class="tilted-card__shadow" aria-hidden="true"></div> <a class="tilted-card__body" href="/projects/discharge-plasma/"> <div class="tilted-card__face"> <div class="project-tilt__visual"> <figure> <picture> <source class="responsive-img-srcset" srcset="/assets/img/design-with-gear-2-480.webp 480w,/assets/img/design-with-gear-2-800.webp 800w,/assets/img/design-with-gear-2-1400.webp 1400w," type="image/webp" sizes="(max-width: 767px) 90vw, 300px"></source> <img src="/assets/img/design-with-gear-2.png" width="100%" height="auto" alt="Development of a Device for Producing Air-Discharge Plasma-Activated Mist" loading="lazy" onerror="this.onerror=null; $('.responsive-img-srcset').remove();"> </picture> </figure> <span class="project-tilt__glass">engineering</span> </div> <div class="project-tilt__content"> <h2 class="card-title">Development of a Device for Producing Air-Discharge Plasma-Activated Mist</h2> <p class="card-text">A magnetic component was developed for the atomization device to magnetize plasma-activated water and enhance the atomization effect.</p> </div> <span class="tilted-card__glare" aria-hidden="true"></span> <span class="tilted-card__rim" aria-hidden="true"></span> <span class="tilted-card__edge" aria-hidden="true"></span> </div> </a> <figcaption class="tilted-card__caption" aria-hidden="true">Development of a Device for Producing Air-Discharge Plasma-Activated Mist</figcaption> </figure> </div> </div> </div> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Zhenyan Xing. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?v=a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?v=85ddb88934d28b74e
