    Experience:
      - company: Chinese University of Hong Kong
        position: "BIRD: Biophysics Informed de novo RNA Binder Design"
        location: Hong Kong
        start_date: Dec 2025
        end_date: Present
        highlights:
          - Developed BIRD to design RNA sequences for protein targets through sequence optimization with a frozen Protenix structure predictor.
          - Designed objectives for RNA geometry and interface chemistry, and combined continuous sequence optimization with discrete mutation search.
          - Evaluated BIRD against four other methods on 109 shared protein targets using AF3, and conducted component ablations and molecular
            dynamics case studies.
        summary: "Supervisor: Prof. Yu Li"
        url: https://anonymous.4open.science/r/BIRD-5D34/
      - company: Tsinghua University
        position: "HomoPrefix: Homolog-Conditioned Protein Sequence Generation"
        location: Shenzhen, China
        start_date: Jun 2026
        end_date: Present
        highlights:
          - Developed HomoPrefix for protein sequence generation conditioned on homologous proteins, using PoET representations to provide sequence
            context to a ProGen2 decoder.
          - Trained and compared generators using compressed reference summaries or residue memory, alongside a model without homologous context,
            under different sequence prefix lengths.
          - Evaluated the use of homologous context on 317 test proteins from families represented in training, using mismatched references while
            holding targets, prefixes, and model weights fixed.
        summary: "Supervisor: Prof. Ziqi Gao"
      - company: Xi’an Jiaotong University
        position: "AbFUSE: Joint Antibody Optimization for Discriminating Similar Targets"
        location: Xi’an, China
        start_date: Sept 2026
        end_date: Oct 2026
        highlights:
          - Investigating whether molecular dynamics supervision can improve downstream sequence generation, using antibody design and target
            discrimination as the application.
          - Built supervision from ATLAS trajectories covering 835 protein systems and adapted Protenix to predict residue fluctuations, distance
            variability, and correlated motion.
          - Developed dynamics prediction heads using Protenix pair representations and evaluated them using frozen backbone and mismatched
            correlation controls.
          - Implemented a workflow to optimize one antibody sequence against intended and related off targets using frozen structure and affinity
            predictors.
        summary: "Supervisor: Fei Wang"
      - company: Collaboration with Xiangru Tang
        position: "BC-Design: A Biochemistry-Aware Framework for Inverse Protein Design"
        location: Remote
        start_date: Aug 2026
        end_date: Oct 2026
        highlights:
          - Conducted controlled experiments on biochemical masking, feature perturbation, and input identifiability to assess how conditioning
            information affects sequence recovery.
          - Evaluated enzyme and antibody design applications using computational metrics and analyzed molecular dynamics trajectories for PGK
            complexes.
          - Prepared responses to reviewers and revised the manuscript to incorporate the additional experiments and clarify the scope of biochemical
            conditioning.
        url: https://github.com/gersteinlab/BC-Design
      - company: University of Virginia
        position: "HelixLinkerLab: AI-Assisted Automatic Design for Protein Fusion Linker"
        location: Charlottesville, VA
        start_date: Feb 2026
        end_date: Apr 2026
        highlights:
          - Developed HelixLinkerLab to generate and evaluate protein fusion constructs from sequence or structure inputs, extending the MBP–DELE1
            linker design workflow to other targets.
          - Integrated analysis of terminal helices and fusion junctions with candidate linker generation, structure prediction, and local sequence
            redesign.
          - Developed computational ranking criteria based on junction confidence, helix continuity, steric clashes, and consistency across prediction
            seeds.
        summary: "Supervisor: Prof. Jie Yang"
      - company: University of Virginia
        position: De novo Helical Linker Design for MBP–DELE1 Fusion Proteins
        location: Charlottesville, VA
        start_date: Nov 2025
        end_date: Feb 2026
        highlights:
          - Designed rigid helical linkers connecting MBP to the DELE1 C-terminal domain to support structural and biochemical characterization.
          - Built a pipeline using RFdiffusion, ProteinMPNN, and AlphaFold3 to generate and computationally assess fusion constructs, selecting five
            candidates using predicted confidence and helix continuity.
          - Analyzed predicted junction interactions and proposed sequence changes to address unfavorable polar contacts and steric clashes.
        summary: "Supervisor: Prof. Jie Yang"
      - company: Southern University of Science and Technology
        position: RFdiffusion-based de novo Closed Repeat Protein Design
        location: Shenzhen, China
        start_date: Jun 2025
        end_date: Aug 2025
        highlights:
          - Developed a workflow with RFdiffusion to generate and connect symmetric protein structures into closed repeat proteins.
          - Generated multiple sequences for candidate structures with ProteinMPNN and evaluated them with SuperFold.
          - Generated 80,224 candidate structures and retained 29,601 after computational screening with SuperFold.
        summary: "Supervisor: Prof. Zhe Li"
